<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>More, owner</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="resbite.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Quicksand:wght@600;700&amp;display=swap">
<style>body{margin:0}a{color:#343043}a:hover{color:#245F60}</style>
</helmet>
<div class="phone" style="width: 390px; height: 844px">
  <div class="scroll">
    <div class="hero">
      <button class="circle" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>Cover photo
    </div>
    <div class="content">
      <h1>Board game night</h1>
      <span class="tag">You're hosting</span>
      <div class="info">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="text"><span class="label">When</span><span class="value">Thu 30 Oct · 19:00 to 22:00</span><span class="sub">Every Thursday</span></span>
      </div>
      <div class="info">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span class="text"><span class="label">Where</span><span class="value">My house</span></span>
      </div>
      <div class="info note">
        <span class="text"><span class="label">Note to guests</span><span class="value">Ring the top bell</span></span>
      </div>
    </div>
  </div>
  <div class="dim"></div>
  <section class="sheet" aria-label="More">
    <div class="grabber"></div>
    <div class="menu">
      <button class="menu-row"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 13v6M9 16h6"/></svg>Add to calendar</button>
      <button class="menu-row"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.6 8.6A6 6 0 0 1 18 11v3l2 3H9"/><path d="M6 6v5l-2 3h6"/><path d="M10 20a2 2 0 0 0 4 0"/><path d="M3 3l18 18"/></svg>Mute this resbite</button>
      <button class="menu-row"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Do this again</button>
    </div>
    <div class="menu-sep"></div>
    <div class="menu">
      <button class="menu-row danger"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9.5 13.5l5 5M14.5 13.5l-5 5"/></svg>Cancel resbite</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
