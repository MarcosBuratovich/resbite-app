<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where sheet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="resbite.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Quicksand:wght@600;700&amp;display=swap">
<style>body{margin:0}a{color:#343043}a:hover{color:#245F60}</style>
</helmet>
<div class="phone" style="width: 390px; height: 844px">
  <header class="task-bar">
    <button class="circle" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h1>New resbite</h1>
  </header>
  <div class="scroll">
    <div class="cover"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>Photo from the idea</div>
    <div class="form">
      <button class="link">Change photo</button>
      <label class="card"><span class="label">Title</span><span class="value name">Board game night</span></label>
    </div>
  </div>
  <div class="dim"></div>
  <section class="sheet" aria-label="Where">
    <div class="grabber"></div>
    <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Where</h2>
    <span class="section-label">Recent places</span>
    <button class="radio-row"><span class="radio on"></span><span class="text"><span class="value">My house</span><span class="sub">Recent</span></span></button>
    <button class="radio-row"><span class="radio"></span><span class="text"><span class="value">The Courtyard café</span><span class="sub">Recent</span></span></button>
    <button class="radio-row"><span class="radio"></span><span class="text"><span class="value">To be decided</span><span class="sub">You can change it later</span></span></button>
    <div class="divider"></div>
    <label class="card"><span class="label">Area (optional)</span><span class="value placeholder">Shown to people who haven't answered yet</span></label>
    <label class="card"><span class="label">Meeting details (optional)</span><span class="value placeholder">Door code, floor, where to find you</span></label>
    <button class="btn">Done</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
