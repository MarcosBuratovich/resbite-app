<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'"
    />
    <title>You’re invited to a resbite</title>
    <meta property="og:title" content="You’re invited to a resbite" />
    <meta property="og:site_name" content="Resbite" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{ORIGIN}}/resbite-mark.png" />
    <meta property="og:image:alt" content="The Resbite mark" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/resbite-mark.png" />
    <link rel="stylesheet" href="/invite.css" />
    <script src="/invite.js" defer></script>
  </head>
  <body>
    <main>
      <img class="mark" src="/resbite-mark.png" alt="" width="56" height="56" />
      <h1>You’re invited</h1>
      <p id="status">Open this link on the iPhone where Resbite is installed.</p>
      <a id="open" class="button" hidden>Open Resbite</a>
      <p class="note">
        Resbite is in private testing. If you don’t have it yet, ask the person who invited you. This page doesn’t
        claim your invitation, so keep the original message private.
      </p>
      <noscript><p class="note">Open the original invitation message on the iPhone where Resbite is installed.</p></noscript>
    </main>
  </body>
</html>
